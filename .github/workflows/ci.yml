name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: HTWind/HTWind.csproj

jobs:
  desktop:
    name: Desktop app (build)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore $env:PROJECT_PATH

      - name: Build (Release, warnings as errors)
        run: dotnet build $env:PROJECT_PATH -c Release --no-restore -warnaserror

  desktop-tests:
    name: Desktop tests (unit + runtime + e2e)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore HTWind.slnx

      - name: Build (Debug)
        run: dotnet build HTWind.slnx -c Debug --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test HTWind.slnx -c Debug --no-build
          --report-trx --results-directory TestResults
          --coverage --coverage-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: TestResults/**
          if-no-files-found: warn

  web:
    name: Web landing (lint + build + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/landing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and type-check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install chromium --with-deps

      - name: E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/landing/test-results/
          if-no-files-found: ignore
