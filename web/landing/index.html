      <p>
        HTWind is an open-source Windows desktop widget host for HTML widgets,
        manifest packages, and controlled PowerShell tooling. Build a cleaner
        Windows desktop with HTML widgets, package imports, and native-feeling
        workflow controls.
      </p>
      <ul>
        <li>HTML, CSS, and JavaScript widgets rendered with WebView2</li>
        <li>Manifest-based packages for asset-backed and multi-widget setups</li>
        <li>Controlled PowerShell actions for diagnostics and desktop workflows</li>
        <li>Built-in widget templates: clock, weather, network tools, process manager, clipboard studio, file explorer, DNS lookup, PowerShell console</li>
